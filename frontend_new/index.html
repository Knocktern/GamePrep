<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GamePrep | ARCADE</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .auth-container {
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    .auth-card {
      width: 400px;
      max-width: 90%;
    }
    .form-group {
      margin-bottom: 1.5rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--neon-purple);
      font-weight: 600;
    }
    .auth-actions {
      display: flex;
      gap: 1rem;
      margin-top: 2rem;
    }
    .auth-actions button {
      flex: 1;
    }
    .tagline {
      font-size: 1.2rem;
      color: var(--neon-green);
      margin-bottom: 2rem;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <h1 class="retro-title" style="cursor:pointer;" onclick="window.location.href='landing.html'">GAMEPREP</h1>
    <p class="tagline">INSERT COIN TO PREPARE</p>

    <div class="cyber-panel auth-card">
      <div id="authMessage" class="msg-box"></div>

      <div class="form-group">
        <label for="username">PLAYER TAG</label>
        <input type="text" id="username" class="cyber-input" placeholder="Enter Username..." autocomplete="off">
      </div>

      <div class="form-group">
        <label for="password">ACCESS CODE</label>
        <input type="password" id="password" class="cyber-input" placeholder="Enter Password..." autocomplete="off">
      </div>

      <div class="auth-actions">
        <button id="loginBtn" class="cyber-btn">LOGIN</button>
        <button id="signupBtn" class="cyber-btn" style="border-color: var(--neon-blue); color: var(--neon-blue);">SIGNUP</button>
      </div>    
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
